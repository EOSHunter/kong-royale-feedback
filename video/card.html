<!doctype html><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Changa+One&family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@600;700&display=swap">
<style>
:root{--bg:#101719;--surface:#172022;--text:#EEEADF;--muted:#A5B1A4;--accent:#EABC39;--shield:#58BCEB;--danger:#FF8C88;--border:#465052}
*{box-sizing:border-box;margin:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:var(--bg);color:var(--text);font-family:Barlow,sans-serif}
html.clear,body.clear{background:transparent}
.disp{font-family:"Changa One",sans-serif;text-transform:uppercase;line-height:.9}
.eb{font-family:"Barlow Semi Condensed";font-weight:700;letter-spacing:.32em;text-transform:uppercase;font-size:26px;color:var(--muted);display:flex;gap:22px;align-items:center}
.eb::before{content:"";width:60px;height:2px;background:currentColor}
.eb.y{color:var(--accent)}
.bg{position:absolute;inset:0;background-size:cover;background-position:center}
.scrim{position:absolute;inset:0;background:linear-gradient(90deg,rgba(16,23,25,.97) 0%,rgba(16,23,25,.9) 38%,rgba(16,23,25,.35) 62%,rgba(16,23,25,.1))}
.wrap{position:absolute;left:120px;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center;gap:28px;width:1100px}
h1{font-size:150px}
h2{font-size:110px}
p{font-size:34px;line-height:1.45;color:#D9D5CA;max-width:900px}
.rule{width:220px;height:6px;background:var(--accent)}
.lower{position:absolute;left:0;right:0;bottom:0;padding:44px 120px 56px;background:linear-gradient(0deg,rgba(16,23,25,.96) 0%,rgba(16,23,25,.85) 70%,rgba(16,23,25,0));display:flex;align-items:flex-end;justify-content:space-between;gap:40px}
.lower h3{font-family:"Changa One";font-size:68px;text-transform:uppercase;line-height:1;margin-top:12px}
.lower .note{font-size:28px;color:#D9D5CA;max-width:820px;line-height:1.4;text-align:right}
.tag{position:absolute;top:56px;padding:10px 20px;font-family:"Barlow Semi Condensed";font-weight:700;letter-spacing:.24em;font-size:24px;text-transform:uppercase;background:rgba(16,23,25,.88)}
.tag.l{left:56px;color:var(--muted)} .tag.r{right:56px;color:var(--accent)}
.logo{width:520px}
.chips{display:flex;gap:16px;flex-wrap:wrap}
.chip{padding:12px 22px;border:2px solid var(--border);font-family:"Barlow Semi Condensed";font-weight:700;letter-spacing:.18em;text-transform:uppercase;font-size:24px;color:var(--text)}
.pri{display:inline-block;padding:6px 14px;font-family:"Barlow Semi Condensed";font-weight:700;letter-spacing:.18em;font-size:22px;text-transform:uppercase;background:rgba(255,140,136,.18);color:var(--danger)}
.by{font-family:"Barlow Semi Condensed";font-weight:700;letter-spacing:.2em;font-size:22px;text-transform:uppercase;color:var(--muted)}
.url{font-family:"Barlow Semi Condensed";font-weight:700;letter-spacing:.12em;font-size:34px;color:var(--accent)}
</style>
<body><div id="c"></div>
<script>
const q=new URLSearchParams(location.search), t=q.get("t"), j=JSON.parse(decodeURIComponent(q.get("d")||"{}")), c=document.getElementById("c");
const esc=s=>String(s||"").replace(/[&<>]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[m]));
if(j.clear){ document.body.classList.add("clear"); document.documentElement.classList.add("clear"); }
if(t==="title") c.innerHTML=`<div class="bg" style="background-image:url(${j.bg})"></div><div class="scrim"></div><div class="wrap"><img class="logo" src="../img/brand/kong-royale-lockup.png"><div class="eb y">${esc(j.eb)}</div><h1 class="disp">${j.h}</h1><p>${esc(j.p)}</p></div>`;
if(t==="section") c.innerHTML=`<div class="wrap" style="width:1500px"><div class="eb y">${esc(j.eb)}</div><h2 class="disp" style="font-size:140px">${j.h}</h2><div class="rule"></div><p>${esc(j.p)}</p>${j.chips?`<div class="chips">${j.chips.map(x=>`<span class="chip">${esc(x)}</span>`).join("")}</div>`:""}</div>`;
if(t==="shot") c.innerHTML=`<div class="bg" style="background-image:url(${j.img});${j.contain?"background-size:contain;background-repeat:no-repeat;background-color:#0b0f10":""}"></div>${j.h?`<div class="lower"><div><div class="eb ${j.y?"y":""}">${esc(j.eb)}</div><h3>${esc(j.h)}</h3></div>${j.note?`<div class="note">${esc(j.note)}</div>`:""}</div>`:""}`;
if(t==="finding") c.innerHTML=`<div class="lower" style="padding-top:120px"><div style="display:grid;gap:14px"><div style="display:flex;gap:18px;align-items:center"><span class="pri" style="${j.pc||""}">${esc(j.pri)}</span><span class="by">${esc(j.by)} · ${esc(j.time)}</span></div><h3>${esc(j.h)}</h3><div class="note" style="text-align:left;max-width:1300px">${esc(j.note)}</div></div></div>`;
if(t==="end") c.innerHTML=`<div class="wrap" style="align-items:flex-start"><img class="logo" src="../img/brand/kong-royale-lockup.png"><div class="eb y">RET's Kong Royale feedback</div><h2 class="disp">Thanks for<br>playing.</h2><div class="rule"></div><div class="url">eoshunter.github.io/kong-royale-feedback</div><p style="font-size:28px">Feedback by Ret and Opus 5.5 · Concepts are art direction, not shipped UI.</p></div>`;
</script>
